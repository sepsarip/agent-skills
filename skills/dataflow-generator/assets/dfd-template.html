<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DFD Interactive Architecture Viewer — {{PROJECT_NAME}}</title>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'default', securityLevel: 'loose' });
  </script>
  <style>
    :root {
      --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --muted: #475569;
      --primary: #0284c7; --border: #e2e8f0;
      --pii-bg: #fee2e2; --pii-text: #991b1b;
      --conf-bg: #fef3c7; --conf-text: #92400e;
      --assump-bg: #f3e8ff; --assump-text: #6b21a8;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
    aside { width: 280px; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem; overflow-y: auto; flex-shrink: 0; }
    main { flex: 1; padding: 2rem 3rem; overflow-y: auto; }
    .toolbar { display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center; background: var(--surface); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .toolbar input { padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; flex: 1; }
    .toolbar button { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .dfd-content { background: var(--surface); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border); max-width: 1080px; line-height: 1.6; }
    h2 { border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; margin-top: 2.5rem; }
    .mermaid { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin: 1.25rem 0; text-align: center; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin: 1.25rem 0; font-size: 0.88rem; }
    th, td { border: 1px solid var(--border); padding: 0.6rem 0.8rem; text-align: left; }
    th { background: #f1f5f9; font-weight: 600; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .badge-pii { background: var(--pii-bg); color: var(--pii-text); }
    .badge-conf { background: var(--conf-bg); color: var(--conf-text); }
    .badge-assump { background: var(--assump-bg); color: var(--assump-text); }
    @media print {
      aside, .toolbar { display: none !important; }
      body, main { height: auto; overflow: visible; padding: 0; }
      .dfd-content { border: none; padding: 0; max-width: 100%; }
    }
  </style>
</head>
<body>
  <aside>
    <h3 style="margin-top:0;">🔄 DFD Architecture</h3>
    <p style="font-size:0.8rem; color:var(--muted);">Yourdon/DeMarco + xDECAF + STRIDE</p>
    <div id="toc-list" style="font-size:0.9rem; line-height:1.8;"></div>
  </aside>
  <main>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Filter table rows by Flow ID (DF-XX), Process (P1.0), Actor, or $PII..." oninput="filterRows()" />
      <button onclick="window.print()">🖨️ Export PDF</button>
    </div>
    <div class="dfd-content" id="dfdContainer">
      {{HTML_CONTENT}}
    </div>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("dfdContainer");
      container.innerHTML = container.innerHTML
        .replace(/\$(PII|Credentials)/g, m => `<span class="badge badge-pii">${m}</span>`)
        .replace(/\$(Confidential|Internal|Public)/g, m => `<span class="badge badge-conf">${m}</span>`)
        .replace(/\[ASSUMPTION\]/g, `<span class="badge badge-assump">[ASSUMPTION]</span>`);

      const headers = container.querySelectorAll("h2, h3");
      const toc = document.getElementById("toc-list");
      headers.forEach((h, idx) => {
        h.id = "sec-" + idx;
        const a = document.createElement("a");
        a.href = "#sec-" + idx;
        a.textContent = h.textContent;
        a.style.display = "block";
        a.style.color = "var(--text)";
        a.style.textDecoration = "none";
        a.style.paddingLeft = h.tagName === "H3" ? "0.75rem" : "0";
        a.style.fontWeight = h.tagName === "H2" ? "600" : "400";
        toc.appendChild(a);
      });
    });

    function filterRows() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      document.querySelectorAll("#dfdContainer tbody tr").forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    }
  </script>
</body>
</html>
