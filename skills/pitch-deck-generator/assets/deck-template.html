<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{DECK_TITLE}}</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --verified-bg: rgba(16, 185, 129, 0.15);
      --verified-fg: #34d399;
      --bottomsup-bg: rgba(56, 189, 248, 0.15);
      --bottomsup-fg: #38bdf8;
      --input-bg: rgba(245, 158, 11, 0.16);
      --input-fg: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Top Bar */
    .topbar {
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 13px;
      z-index: 20;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--accent); }
    .legend { display: flex; gap: 8px; align-items: center; }
    .controls { display: flex; gap: 8px; align-items: center; }
    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    /* Stage & Slide */
    .stage {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    .slides-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow-y: auto;
    }
    .slide {
      display: none;
      width: 100%;
      max-width: 1060px;
      min-height: 560px;
      background: linear-gradient(145deg, #0f172a 0%, #090d16 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 60px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .slide.active { display: flex; }
    .slide-number {
      position: absolute;
      bottom: 20px;
      right: 28px;
      font-size: 12px;
      color: var(--muted);
    }
    .slide h1 { font-size: 2.5rem; color: var(--accent); margin-bottom: 12px; line-height: 1.2; }
    .slide h2 {
      font-size: 1.55rem;
      color: var(--text);
      border-bottom: 2px solid var(--surface-2);
      padding-bottom: 12px;
      margin-bottom: 24px;
      line-height: 1.3;
    }
    .slide ul { margin-left: 22px; margin-bottom: 18px; }
    .slide li { font-size: 1.2rem; line-height: 1.6; margin-bottom: 12px; color: #e2e8f0; }
    .slide li strong { color: var(--accent); }
    .slide blockquote {
      background: var(--surface-2);
      border-left: 4px solid var(--accent);
      padding: 14px 20px;
      border-radius: 0 8px 8px 0;
      margin-top: 14px;
      font-size: 1.05rem;
      color: #e2e8f0;
    }
    .slide table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.98rem;
    }
    .slide th {
      background: var(--surface-2);
      color: var(--accent);
      text-align: left;
      padding: 10px 14px;
      border: 1px solid var(--border);
    }
    .slide td {
      padding: 10px 14px;
      border: 1px solid var(--border);
      color: #e2e8f0;
    }
    /* Provenance Badges */
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      vertical-align: middle;
      margin-left: 4px;
    }
    .badge-verified { background: var(--verified-bg); color: var(--verified-fg); border: 1px solid rgba(52,211,153,0.35); }
    .badge-bottomsup { background: var(--bottomsup-bg); color: var(--bottomsup-fg); border: 1px solid rgba(56,189,248,0.35); }
    .badge-input { background: var(--input-bg); color: var(--input-fg); border: 1px solid rgba(251,191,36,0.35); }
    /* Diagram Wrapper */
    .mermaid-box {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin: 14px 0;
      display: flex;
      justify-content: center;
      overflow: auto;
    }
    /* Speaker Notes Drawer */
    .notes-drawer {
      width: 340px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 24px;
      display: none;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .notes-drawer.open { display: flex; }
    .notes-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 700; }
    .notes-content { font-size: 14.5px; line-height: 1.65; color: #cbd5e1; white-space: pre-wrap; }
    /* Progress Bar */
    .progress-bar { height: 4px; background: var(--surface-2); width: 100%; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease; }
    /* Grid Overview Modal */
    .grid-modal {
      position: fixed;
      inset: 48px 0 0 0;
      background: rgba(9, 13, 22, 0.96);
      z-index: 30;
      padding: 32px;
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      overflow-y: auto;
    }
    .grid-modal.open { display: grid; }
    .grid-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .grid-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .grid-card-num { font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
    .grid-card-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.35; }
    @media print {
      body { overflow: visible; height: auto; background: #090d16; }
      .topbar, .notes-drawer, .progress-bar, .grid-modal { display: none !important; }
      .slides-viewport { display: block; padding: 0; }
      .slide {
        display: flex !important;
        page-break-after: always;
        min-height: 92vh;
        margin-bottom: 20px;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <span>🎯 {{DECK_TITLE}}</span>
      <span id="slideCounter" style="color: var(--muted); font-weight: 400;">1 / 12</span>
    </div>
    <div class="legend">
      <span class="badge badge-verified">[VERIFIED]</span>
      <span class="badge badge-bottomsup">[BOTTOMS-UP]</span>
      <span class="badge badge-input">[FOUNDER-INPUT]</span>
    </div>
    <div class="controls">
      <button class="btn" onclick="prevSlide()">← Prev</button>
      <button class="btn" onclick="nextSlide()">Next →</button>
      <button class="btn" onclick="toggleNotes()">📝 Notes (S)</button>
      <button class="btn" onclick="toggleGrid()">⊞ Grid (G)</button>
      <button class="btn" onclick="window.print()">🖨️ PDF</button>
    </div>
  </div>

  <div class="stage">
    <div class="slides-viewport" id="slidesContainer">
      {{SLIDES_HTML}}
    </div>
    <aside class="notes-drawer open" id="notesDrawer">
      <div class="notes-title">🎙️ Speaker Notes & Delivery Script</div>
      <div class="notes-content" id="notesContent"></div>
    </aside>
  </div>

  <div class="grid-modal" id="gridModal"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <script src="{{MERMAID_CDN}}"></script>
  <script>
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    }
    const slides = Array.from(document.querySelectorAll('.slide'));
    const notesContent = document.getElementById('notesContent');
    const slideCounter = document.getElementById('slideCounter');
    const progressFill = document.getElementById('progressFill');
    const notesDrawer = document.getElementById('notesDrawer');
    const gridModal = document.getElementById('gridModal');
    let current = 0;

    function showSlide(index) {
      if (index < 0 || index >= slides.length) return;
      slides.forEach((s, i) => s.classList.toggle('active', i === index));
      current = index;
      slideCounter.textContent = `${current + 1} / ${slides.length}`;
      progressFill.style.width = `${((current + 1) / slides.length) * 100}%`;
      const note = slides[current].getAttribute('data-notes') || 'No speaker notes for this slide.';
      notesContent.textContent = note;
      gridModal.classList.remove('open');
    }
    function nextSlide() { showSlide(current + 1); }
    function prevSlide() { showSlide(current - 1); }
    function toggleNotes() { notesDrawer.classList.toggle('open'); }
    function toggleGrid() { gridModal.classList.toggle('open'); }

    // Populate Grid Overview
    slides.forEach((s, idx) => {
      const heading = s.querySelector('h1, h2');
      const card = document.createElement('div');
      card.className = 'grid-card';
      card.innerHTML = `<div class="grid-card-num">SLIDE ${idx + 1}</div><div class="grid-card-title">${heading ? heading.textContent : 'Slide'}</div>`;
      card.onclick = () => showSlide(idx);
      gridModal.appendChild(card);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
      if (e.key === 's' || e.key === 'S') { toggleNotes(); }
      if (e.key === 'g' || e.key === 'G') { toggleGrid(); }
    });

    showSlide(0);
  </script>
</body>
</html>
